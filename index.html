<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>HeronMorning</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      overflow: hidden;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #0a0a0a;
      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;
    }

    /* 顶部语言切换 */
    .topbar {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 20;
    }

    .lang-switch {
      display: flex;
      align-items: center;
      gap: 8px;

      padding: 8px 14px;

      border-radius: 999px;

      background: rgba(255,255,255,0.06);

      border: 1px solid rgba(255,255,255,0.08);

      backdrop-filter: blur(12px);
    }

    .lang-btn {
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.6);

      cursor: pointer;

      font-size: 14px;
      font-weight: 600;

      transition: 0.25s ease;
    }

    .lang-btn.active {
      color: white;
    }

    /* 背景 */
    .bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .blur {
      position: absolute;
      width: 500px;
      height: 500px;

      border-radius: 50%;

      filter: blur(120px);

      opacity: 0.35;

      animation: float 10s ease-in-out infinite;
    }

    .blur1 {
      background: #2563eb;
      top: -120px;
      left: -120px;
    }

    .blur2 {
      background: #7c3aed;
      bottom: -150px;
      right: -120px;

      animation-delay: 2s;
    }

    @keyframes float {
      0% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(30px);
      }
      100% {
        transform: translateY(0px);
      }
    }

    /* 卡片 */
    .card {
      position: relative;
      z-index: 10;

      width: 90%;
      max-width: 720px;

      padding: 56px;

      border-radius: 32px;

      background: rgba(255,255,255,0.06);

      border: 1px solid rgba(255,255,255,0.08);

      backdrop-filter: blur(24px);

      box-shadow:
        0 10px 40px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.05);

      text-align: center;

      animation: show 1s ease;
    }

    @keyframes show {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0px) scale(1);
      }
    }

    .logo {
      width: 82px;
      height: 82px;

      margin: 0 auto 28px;

      border-radius: 24px;

      background: linear-gradient(
        135deg,
        #ffffff,
        #d4d4d4
      );

      display: flex;
      align-items: center;
      justify-content: center;

      color: black;

      font-size: 34px;
      font-weight: 700;

      box-shadow:
        0 10px 30px rgba(255,255,255,0.12);
    }

    h1 {
      font-size: 52px;
      font-weight: 700;

      letter-spacing: -2px;

      margin-bottom: 16px;
    }

    .desc {
      font-size: 18px;
      line-height: 1.8;

      color: rgba(255,255,255,0.72);

      max-width: 560px;

      margin: 0 auto;
    }

    .loading {
      margin-top: 30px;

      width: 120px;
      height: 3px;

      background: rgba(255,255,255,0.08);

      border-radius: 999px;

      overflow: hidden;

      margin-left: auto;
      margin-right: auto;
    }

    .loading::after {
      content: "";

      display: block;

      width: 40%;
      height: 100%;

      background: white;

      border-radius: 999px;

      animation: loading 2s infinite linear;
    }

    @keyframes loading {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(300%);
      }
    }

    .buttons {
      margin-top: 42px;

      display: flex;
      justify-content: center;
      gap: 18px;

      flex-wrap: wrap;
    }

    .btn {
      text-decoration: none;

      padding: 14px 26px;

      border-radius: 999px;

      transition: all 0.3s ease;

      font-size: 15px;
      font-weight: 600;
    }

    .primary {
      background: white;
      color: black;
    }

    .primary:hover {
      transform: translateY(-2px);

      box-shadow:
        0 10px 30px rgba(255,255,255,0.15);
    }

    .secondary {
      background: rgba(255,255,255,0.06);

      color: white;

      border: 1px solid rgba(255,255,255,0.08);
    }

    .secondary:hover {
      background: rgba(255,255,255,0.12);
    }

    .footer {
      margin-top: 36px;

      font-size: 13px;

      color: rgba(255,255,255,0.4);
    }

    @media (max-width: 768px) {
      .card {
        padding: 36px 24px;
      }

      h1 {
        font-size: 38px;
      }

      .desc {
        font-size: 16px;
      }

      .topbar {
        top: 16px;
        right: 16px;
      }
    }
  </style>
</head>

<body>

  <!-- 右上角语言切换 -->
  <div class="topbar">
    <div class="lang-switch">
      <button class="lang-btn active" id="zhBtn">
        中文
      </button>

      <span style="opacity: 0.3;">|</span>

      <button class="lang-btn" id="enBtn">
        EN
      </button>
    </div>
  </div>

  <!-- 背景 -->
  <div class="bg">
    <div class="blur blur1"></div>
    <div class="blur blur2"></div>
  </div>

  <!-- 主卡片 -->
  <div class="card">

    <div class="logo">
      H
    </div>

    <h1 id="title">
      HeronMorning
    </h1>

    <p class="desc" id="desc">
      一个记录技术、设计、思考与生活的个人空间。
    </p>

    <div class="loading"></div>

    <div class="buttons">

      <a
        class="btn primary"
        id="enterBtn"
        href="https://blog.heronmorning.dpdns.org/"
      >
        进入博客
      </a>

      <a
        class="btn secondary"
        href="https://github.com/chen865"
      >
        GitHub
      </a>

    </div>

    <div class="footer" id="footer">
      页面将在几秒后自动跳转...
    </div>

  </div>

  <script>
    const i18n = {
      zh: {
        title: "HeronMorning",
        desc: "一个记录技术、设计、思考与生活的个人空间。",
        enter: "进入博客",
        footer: "页面将在几秒后自动跳转..."
      },

      en: {
        title: "HeronMorning",
        desc: "A personal space for technology, design, thoughts, and life.",
        enter: "Enter Blog",
        footer: "Redirecting automatically in a few seconds..."
      }
    };

    let currentLang = "zh";

    function setLanguage(lang) {

      currentLang = lang;

      document.documentElement.lang =
        lang === "zh" ? "zh-CN" : "en";

      document.getElementById("title").innerText =
        i18n[lang].title;

      document.getElementById("desc").innerText =
        i18n[lang].desc;

      document.getElementById("enterBtn").innerText =
        i18n[lang].enter;

      document.getElementById("footer").innerText =
        i18n[lang].footer;

      document
        .getElementById("zhBtn")
        .classList.toggle("active", lang === "zh");

      document
        .getElementById("enBtn")
        .classList.toggle("active", lang === "en");

      localStorage.setItem("lang", lang);
    }

    // 自动识别浏览器语言
    const savedLang = localStorage.getItem("lang");

    if (savedLang) {
      setLanguage(savedLang);
    } else {
      const browserLang =
        navigator.language.toLowerCase();

      if (browserLang.includes("zh")) {
        setLanguage("zh");
      } else {
        setLanguage("en");
      }
    }

    // 点击切换
    document
      .getElementById("zhBtn")
      .addEventListener("click", () => {
        setLanguage("zh");
      });

    document
      .getElementById("enBtn")
      .addEventListener("click", () => {
        setLanguage("en");
      });

    // 自动跳转
    setTimeout(() => {
      window.location.href =
        "https://blog.heronmorning.dpdns.org/";
    }, 5000);
  </script>

</body>
</html>
